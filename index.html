<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Someone Special ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hearts"></div>

<div class="container" id="main-container">
    <div class="card">
        <div class="heart">❤️</div>

        <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" class="gif" alt="Cute animated cat">

        <h1>Can I have your heart?</h1>

        <p class="subtitle">
            Think carefully before answering. ❤️
        </p>

        <p id="message" class="quote">
            Every love story starts with one answer.
        </p>

        <div class="buttons">
            <button id="yesBtn">
                Yes ❤️
            </button>
            <button id="noBtn">
                No 💔
            </button>
        </div>
    </div>
</div>

<!-- Hidden Success Screen -->
<div id="success-screen" class="success hidden">
    <h1>❤️ YAY!! ❤️</h1>
    <h2>You said YES! 🥰</h2>
    <p>I promise to make every moment with you special.</p>
    <p>I love you forever. ❤️</p>
</div>

<script src="script.js"></script>

</body>
</html>
